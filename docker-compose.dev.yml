# 本地开发只起数据库：docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xgdesign
      POSTGRES_PASSWORD: xgdesign
      POSTGRES_DB: xgdesign
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
