server:
  port: 8090

spring:
  application:
    name: xgdesign-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xgdesign}
    username: ${POSTGRES_USER:xgdesign}
    password: ${POSTGRES_PASSWORD:xgdesign}
  jpa:
    hibernate:
      ddl-auto: validate        # schema 只由 Flyway 管理
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:xgdesign-dev-secret-key-change-me-in-production-0123456789abcdef}
    ttl-hours: ${JWT_TTL_HOURS:24}
