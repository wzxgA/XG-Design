server:
  port: 8090

spring:
  application:
    name: xgdesign-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xgdesign}
    username: ${POSTGRES_USER:xgdesign}
    password: ${POSTGRES_PASSWORD:xgdesign}
  jpa:
    hibernate:
      ddl-auto: validate        # schema 只由 Flyway 管理
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-39852c9d7b684ec09339beb32c23f5f9}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-v4-flash}
          temperature: 0.7
          max-tokens: 16384

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5183}
  jwt:
    secret: ${JWT_SECRET:xgdesign-dev-secret-key-change-me-in-production-0123456789abcdef}
    ttl-hours: ${JWT_TTL_HOURS:24}

xgdesign:
  ai:
    enabled: ${AI_ENABLED:true}
    mock-mode: ${AI_MOCK_MODE:false}
    max-history-messages: 20
    system-prompt-extra: ""
